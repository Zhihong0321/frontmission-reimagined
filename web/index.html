<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mecha Trader — Alpha 1</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<header id="status">
  <div class="brand">MECHA<span>TRADER</span></div>
  <div class="stat"><label>Day</label><span id="stat-day">—</span></div>
  <div class="stat"><label>Credits</label><span id="stat-cash">—</span></div>
  <div class="stat"><label>Net worth</label><span id="stat-worth">—</span></div>
  <div class="stat wide"><label>Position</label><span id="stat-where">—</span></div>
  <div class="stat"><label>Hold</label><span id="stat-hold">—</span></div>
  <div class="stat"><label>Upkeep</label><span id="stat-upkeep">—</span></div>
  <div class="spacer"></div>
  <button id="btn-new" class="ghost">New run</button>
</header>

<p id="error" hidden></p>

<main>
  <section class="panel" id="market-panel">
    <h2>Market</h2>
    <div id="market-body"></div>
  </section>

  <aside>
    <section class="panel">
      <h2>Roads</h2>
      <div id="routes-body"></div>
      <div class="row-actions">
        <button data-wait="1">Wait 1 day</button>
        <button data-wait="7">Wait 7 days</button>
      </div>
    </section>

    <section class="panel">
      <h2>Hold</h2>
      <div id="cargo-body"></div>
    </section>

    <section class="panel">
      <h2>Depot</h2>
      <div id="shipyard-body"></div>
    </section>

    <section class="panel">
      <h2>Log</h2>
      <ol id="log-body"></ol>
    </section>
  </aside>
</main>

<script src="app.js?v=3"></script>
</body>
</html>
